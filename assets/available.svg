<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="900" height="110" role="img" aria-label="Open to full-time AI Engineering opportunities · Available now">
  <defs>
    <!-- le contour : un dégradé qui tourne autour de la pastille -->
    <linearGradient id="bord" gradientUnits="userSpaceOnUse" x1="20" y1="55" x2="880" y2="55">
      <stop offset="0" stop-color="#1a7f37"/>
      <stop offset=".35" stop-color="#3fb950"/>
      <stop offset=".6" stop-color="#aff5b4"/>
      <stop offset="1" stop-color="#1a7f37"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 450 55" to="360 450 55" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- le reflet qui traverse le texte -->
    <linearGradient id="reflet" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#c8f7d0"/>
      <stop offset=".6" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6edf3"/>
      <animate attributeName="x1" values="-300;900" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1200" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="flou" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="fond" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#132a1c"/><stop offset="1" stop-color="#0d1117"/></radialGradient>
  </defs>

  <!-- halo qui respire derrière la pastille -->
  <rect x="20" y="15" width="860" height="80" rx="40" fill="none" stroke="url(#bord)" stroke-width="6" filter="url(#flou)">
    <animate attributeName="opacity" values=".35;.9;.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- la pastille -->
  <rect x="20" y="15" width="860" height="80" rx="40" fill="url(#fond)" stroke="url(#bord)" stroke-width="2"/>

  <text x="450" y="63" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing=".2">
    <tspan fill="url(#reflet)">Open to full-time AI Engineering opportunities</tspan>
    <tspan fill="#8b949e"> · </tspan>
    <tspan fill="#3fb950">Available now</tspan>
  </text>
</svg>
